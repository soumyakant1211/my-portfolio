<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- 1. Theme script FIRST — prevents any flash of wrong theme before CSS loads -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch (_) {}
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Soumyakant Tripathy | SDET Engineer</title>
    <meta name="description" content="Senior SDET &amp; QA Automation Engineer specializing in Python, Selenium, Playwright, and CI/CD pipelines. Exploring modern AI-driven testing." />
    <meta name="author" content="Soumyakant Tripathy" />

    <!-- Open Graph / LinkedIn Preview -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Soumyakant Tripathy" />
    <meta property="og:title" content="Soumyakant Tripathy | SDET Engineer" />
    <meta property="og:description" content="Senior SDET &amp; QA Automation Engineer specializing in Python, Selenium, Playwright, and CI/CD pipelines." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Soumyakant Tripathy | SDET Engineer" />
    <meta name="twitter:description" content="Senior SDET &amp; QA Automation Engineer specializing in Python, Selenium, Playwright, and CI/CD pipelines." />

    <!-- Structured data so search engines can show a rich profile result -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Soumyakant Tripathy",
        "jobTitle": "Senior Software Engineer (SDET)",
        "worksFor": { "@type": "Organization", "name": "Relevance Lab" },
        "knowsAbout": ["Test Automation", "Selenium", "Playwright", "PyTest", "API Testing", "CI/CD"],
        "sameAs": [
          "https://github.com/soumyakant1211",
          "https://www.linkedin.com/in/soumyakant-tripathy/"
        ]
      }
    </script>

    <!-- 2. Non-render-blocking font loading via preconnect + preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" />
    </noscript>

    <!-- 3. DNS prefetch for GitHub/LinkedIn links -->
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="dns-prefetch" href="https://www.linkedin.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
